<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RobotController</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 20px; }
        h1 { color: #fff; margin-bottom: 20px; font-size: 18px; }
        .tabs { display: flex; gap: 2px; margin-bottom: 20px; }
        .tabs button {
            background: #2d2d2d; color: #999; border: none; padding: 10px 24px;
            cursor: pointer; font-family: monospace; font-size: 14px; border-radius: 4px 4px 0 0;
        }
        .tabs button.active { background: #0e639c; color: #fff; }
        .tab-content {
            background: #252526; border-radius: 0 4px 4px 4px; padding: 16px;
            min-height: 400px;
        }
        #can-output {
            width: 100%; height: 360px; background: #1e1e1e; color: #d4d4d4;
            border: 1px solid #3c3c3c; padding: 10px; font-family: monospace; font-size: 13px;
            resize: none; outline: none; overflow-y: auto; white-space: pre;
        }
        .stats { margin-top: 8px; color: #888; font-size: 12px; }
        .special-grid { display: flex; gap: 24px; align-items: flex-start; }
        .special-monitor { flex: 1; min-width: 0; }
        .special-tx { flex: 1; min-width: 0; }
        .special-forms { display: flex; gap: 24px; align-items: flex-start; }
        .special-forms > div { flex: 1; min-width: 0; }
        .joint-row {
            display: flex; align-items: center; gap: 12px;
            padding: 8px 0; border-bottom: 1px solid #3c3c3c;
        }
        .joint-row:last-child { border-bottom: none; }
        .joint-label { width: 80px; color: #aaa; font-size: 14px; }
        .joint-btn {
            width: 36px; height: 36px; border: none; border-radius: 4px;
            background: #0e639c; color: #fff; font-size: 18px; cursor: pointer;
            font-family: monospace;
        }
        .joint-btn:active { background: #1177bb; }
        .joint-angle {
            width: 80px; text-align: center; font-size: 20px; color: #fff;
            font-family: monospace;
        }
        #joints-container { margin-top: 8px; }
        .mushroom-btn {
            width: 120px; height: 120px; border-radius: 50%;
            background: #e02424; color: #fff; border: 4px solid #8f1b1b;
            font-family: monospace; font-size: 16px; font-weight: bold;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .mushroom-btn:hover { background: #ff3b3b; }
        .mushroom-btn:active { background: #b01818; }
        .mushroom-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 16px 0; }
        .pad { display: grid; grid-template: 60px 60px 60px / 60px 60px 60px; gap: 4px; justify-content: center; margin: 24px auto; }
        .pad button { font-size: 24px; border: none; border-radius: 6px; cursor: pointer; background: #2d2d2d; color: #fff; }
        .pad button:active { background: #0e639c; }
        .pad .empty { visibility: hidden; }
        .save-btn {
            background: #2d8c2d; color: #fff; border: none; padding: 8px 20px;
            font-family: monospace; font-size: 14px; cursor: pointer; border-radius: 4px;
        }
        .save-btn:hover { background: #36a336; }
        .cancel-btn {
            background: #555; color: #fff; border: none; padding: 8px 20px;
            font-family: monospace; font-size: 14px; cursor: pointer; border-radius: 4px;
        }
        .cancel-btn:hover { background: #6a6a6a; }
        .saved-title { color: #ccc; font-size: 14px; margin-bottom: 8px; }
        .saved-list { margin-top: 8px; max-height: 300px; overflow-y: auto; }
        .saved-item {
            display: flex; align-items: center; gap: 8px; padding: 4px 0;
            font-size: 13px; color: #d4d4d4;
        }
        .saved-item button {
            background: #2d2d2d; color: #fff; border: none; padding: 2px 10px;
            font-family: monospace; font-size: 12px; cursor: pointer; border-radius: 3px;
        }
        .saved-item button:hover { background: #3c3c3c; }
        .saved-item .del-btn { color: #e06c75; }
        .ctrl-grid { display: flex; gap: 24px; }
        .ctrl-left { flex: 1; min-width: 0; }
        .ctrl-right { flex: 1; min-width: 0; }
        .ctrl-leds { display: flex; flex-direction: column; justify-content:center; gap: 24px; padding-left: 16px; border-left: 1px solid #3c3c3c; }
        .leds { display: flex; gap: 32px; align-items: center; }
        .led-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .led {
            width: 64px; height: 64px; border-radius: 50%;
            border: 4px solid #555; transition: background 0.2s, box-shadow 0.2s;
        }
        .led.off { background: #1a1a1a; box-shadow: none; }
        .led.green { background: #00ff00; box-shadow: 0 0 20px #00ff00; }
        .led.red { background: #ff0000; box-shadow: 0 0 20px #ff0000; }
        .led.yellow { background: #ffdd00; box-shadow: 0 0 20px #ffdd00; }
        .led.orange { background: #ff8c00; box-shadow: 0 0 20px #ff8c00; }
        .led-label { color: #888; font-size: 14px; text-align: center; }
        .field { margin-bottom: 14px; }
        .field label { display: block; color: #aaa; font-size: 12px; margin-bottom: 4px; }
        .field input {
            width: 100%; max-width: 300px; background: #1e1e1e; color: #d4d4d4;
            border: 1px solid #3c3c3c; padding: 8px 10px; font-family: monospace; font-size: 14px;
            outline: none;
        }
        .field input:focus { border-color: #0e639c; }
        #tx-btn {
            background: #0e639c; color: #fff; border: none; padding: 10px 28px;
            font-family: monospace; font-size: 14px; cursor: pointer; border-radius: 4px;
            margin-top: 6px;
        }
        #tx-btn:hover { background: #1177bb; }
        #tx-status { margin-top: 10px; font-size: 13px; color: #888; }
        #cfg-status { margin-top: 12px; font-size: 13px; font-family: monospace; white-space: pre-wrap; }
        #cfg-status.ok { color: #2d8c2d; }
        #cfg-status.err { color: #e06c75; }
    </style>
</head>
<body>
    <h1>RobotController</h1>
    <div class="tabs">
        <button class="active" onclick="switchTab('special')">Opciones especiales</button>
        <button onclick="switchTab('ctrl')">Control</button>
        <button onclick="switchTab('cfg')">Config</button>
    </div>
    <div id="tab-special" class="tab-content">
        <div class="special-grid">
            <div class="special-monitor">
                <h3 style="color:#ccc; margin-bottom:14px;">Monitor CAN</h3>
                <textarea id="can-output" readonly></textarea>
                <div class="stats" id="stats">Esperando mensajes...</div>
            </div>

            <div class="special-tx">
                <div class="special-forms">
                    <div>
                        <h3 style="color:#ccc; margin-bottom:14px;">TX Manual</h3>

                        <div class="field">
                            <label>ID (hex)</label>
                            <input type="text" id="tx-id" value="123" placeholder="ej: 123">
                        </div>
                        <div class="field">
                            <label>Posición (grados)</label>
                            <input type="number" id="tx-pos" value="0" step="0.1" placeholder="0.0">
                        </div>
                        <div class="field">
                            <label>Velocidad (rad/s)</label>
                            <input type="number" id="tx-vel" value="0" step="0.01" placeholder="0.0">
                        </div>
                        <button id="tx-btn" onclick="sendCanMsg()">Enviar CAN</button>
                        <div id="tx-status"></div>
                    </div>

                    <div>
                        <h3 style="color:#ccc; margin-bottom:14px;">Calibración</h3>

                        <div class="field">
                            <label>ID (hex)</label>
                            <input type="text" id="cal-id" value="456" placeholder="ej: 456">
                        </div>
                        <div class="field">
                            <label>Posición (grados)</label>
                            <input type="number" id="cal-pos" value="0" step="0.1" placeholder="0.0">
                        </div>
                        <div class="field">
                            <label>Ratio</label>
                            <input type="number" id="cal-ratio" value="0" step="0.01" placeholder="0.0">
                        </div>
                        <div class="field">
                            <label>Mínimo</label>
                            <input type="number" id="cal-min" value="0" step="0.01" placeholder="0.0">
                        </div>
                        <div class="field">
                            <label>Máximo</label>
                            <input type="number" id="cal-max" value="0" step="0.01" placeholder="0.0">
                        </div>
                        <button id="tx-btn" onclick="sendCal()" style="background:#2d8c2d;">Enviar Calibración</button>
                        <div id="cal-status" style="margin-top: 10px; font-size: 13px; color: #888;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="tab-cfg" class="tab-content" style="display:none">
        <div class="field">
            <label>Archivo de configuración (JSON)</label>
            <input type="file" id="cfg-file" accept=".json,application/json">
        </div>
        <button id="tx-btn" onclick="validateConfig()">Set config</button>
        <button id="tx-btn" onclick="applyConfig()" style="background:#2d8c2d;">Calibration</button>
        <div id="cfg-status"></div>
    </div>

    <div id="tab-ctrl" class="tab-content" style="display:none">
        <div class="ctrl-grid">
            <div class="ctrl-left">
                <div id="joints-container"></div>
                <div style="display:flex; gap:12px; margin-top:12px;">
                    <button class="save-btn" onclick="applyMove()">Aplicar</button>
                    <button class="cancel-btn" onclick="cancelMove()">Cancelar</button>
                </div>
            </div>
            <div class="ctrl-right">
                <div style="display:flex; align-items:center; gap:12px; margin-bottom:8px;">
                    <span class="saved-title">Puntos guardados</span>
                    <button class="save-btn" onclick="savePos()">savePos</button>
                </div>
                <div class="saved-list" id="saved-list"></div>
            </div>
            <div class="ctrl-leds">
                <div class="led-wrap"><div class="led off" id="led0"></div><div class="led-label">LED 1</div></div>
                <div class="led-wrap"><div class="led off" id="led1"></div><div class="led-label">LED 2</div></div>
            </div>
        </div>
        <hr style="border-color:#3c3c3c; margin: 16px 0;">
        <div style="display:flex; gap:24px; align-items:center; margin-bottom:8px;">
            <span class="saved-title">FK Resultado</span>
        </div>
        <div style="display:flex; gap:24px; font-size:14px;">
            <span style="color:#aaa;">X: <span id="fk-x" style="color:#fff; font-size:16px;">0.00</span></span>
            <span style="color:#aaa;">Y: <span id="fk-y" style="color:#fff; font-size:16px;">0.00</span></span>
            <span style="color:#aaa;">Z: <span id="fk-z" style="color:#fff; font-size:16px;">0.00</span></span>
        </div>
        <hr style="border-color:#3c3c3c; margin: 16px 0;">
        <div class="pad">
            <div class="empty"></div>
            <button onclick="sendDir('UP')">↑</button>
            <div class="empty"></div>
            <button onclick="sendDir('LEFT')">←</button>
            <button onclick="sendDir('STOP')">■</button>
            <button onclick="sendDir('RIGHT')">→</button>
            <div class="empty"></div>
            <button onclick="sendDir('DOWN')">↓</button>
            <div class="empty"></div>
        </div>
        <div class="mushroom-wrap">
            <button class="mushroom-btn" onclick="sendError()">STOP</button>
            <span style="color:#aaa; font-size:12px;">Parada de emergencia</span>
        </div>
    </div>

    <script>
        let msgCount = 0;

        function setLed(led, color) {
            const el = document.getElementById('led' + led);
            el.className = 'led ' + (color || 'off');
        }

        let ledBlink = true;

        async function updateState() {
            let root, sub;
            try {
                const r = await fetch('/api/state');
                const st = await r.json();
                root = parseInt(st.root);
                sub = parseInt(st.sub);
            } catch (e) {
                return setTimeout(updateState, 500);
            }
            ledBlink = !ledBlink;
            let led1, led2;
            if (root === 2) {
                led1 = 'red';
                led2 = 'red';
            } else {
                led1 = (root === 0) ? (ledBlink ? 'orange' : 'off')
                     : (root === 1) ? 'green' : 'off';
                led2 = (sub === 1) ? (ledBlink ? 'orange' : 'off') : 'off';
            }
            setLed(0, led1);
            setLed(1, led2);
            setTimeout(updateState, 500);
        }

        function switchTab(name) {
            document.querySelectorAll('.tab-content').forEach(e => e.style.display = 'none');
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + name).style.display = 'block';
            event.target.classList.add('active');
            if (name === 'special' || name === 'can') pollMessages();
        }

        function formatMsg(m) {
            const d = new Date(m.t * 1000);
            const time = d.toLocaleTimeString('es-ES', {hour12: false});
            return `[${time}] ID: ${m.id.padEnd(6)} DLC: ${m.dlc}  DATA: ${m.data}`;
        }

        async function pollMessages() {
            const tab = document.getElementById('tab-special');
            if (tab.style.display === 'none') return;

            try {
                const r = await fetch('/api/messages');
                const msgs = await r.json();
                const out = document.getElementById('can-output');
                out.value = msgs.map(formatMsg).reverse().join('\n');
                out.scrollTop = out.scrollHeight;
                msgCount = msgs.length;
                const lastTime = msgs.length
                    ? new Date(msgs[msgs.length-1].t * 1000).toLocaleTimeString('es-ES', {hour12: false})
                    : '-';
                document.getElementById('stats').textContent =
                    `Mensajes: ${msgCount} | Último: ${lastTime}`;
            } catch (e) {
                document.getElementById('stats').textContent = 'Error conectando...';
            }
            setTimeout(pollMessages, 1000);
        }

        let editing = false;
        let pendingAngles = [];

        async function fetchJoints() {
            const r = await fetch('/api/joints');
            const data = await r.json();
            if (editing) return;
            for (let i = 0; i < data.joints.length; i++) {
                document.getElementById('angle-' + i).textContent = data.joints[i].toFixed(1);
            }
        }

        function readAngles() {
            const angles = [];
            const container = document.getElementById('joints-container');
            const rows = container.querySelectorAll('.joint-row');
            rows.forEach((row, i) => {
                const el = document.getElementById('angle-' + i);
                angles.push(parseFloat(el.textContent));
            });
            return angles;
        }

        async function jointClick(joint, delta) {
            if (!editing) {
                pendingAngles = readAngles();
                editing = true;
            }
            pendingAngles[joint] = (pendingAngles[joint] || 0) + delta;
            document.getElementById('angle-' + joint).textContent = pendingAngles[joint].toFixed(1);
        }

        async function cancelMove() {
            editing = false;
            pendingAngles = [];
            fetchJoints();
        }

        async function applyMove() {
            const angles = readAngles();
            try {
                const r = await fetch('/api/movej', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({angles, vel: 30})
                });
                const result = await r.json();
                if (!result.ok && result.error) {
                    console.log('MoveJ rechazado: ' + result.error);
                }
            } catch (e) {}
            editing = false;
            pendingAngles = [];
            fetchJoints();
        }

        async function sendDir(dir) {
            try {
                await fetch('/api/control', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({dir})
                });
            } catch (e) {}
        }

        async function sendError() {
            try {
                await fetch('/api/error', {method: 'POST'});
            } catch (e) {}
        }

        async function fetchSaved() {
            const r = await fetch('/api/points');
            const data = await r.json();
            renderSaved(data);
        }

        function renderSaved(data) {
            const list = document.getElementById('saved-list');
            list.innerHTML = '';
            for (let idx = 0; idx < data.count; idx++) {
                const pos = data.points[idx];
                const angles = pos.map((a, i) => `J${i}:${a.toFixed(1)}`).join(' ');
                const div = document.createElement('div');
                div.className = 'saved-item';
                div.innerHTML = `
                    <span>${idx + 1}.</span>
                    <span>${angles}</span>
                    <button onclick="movePos(${idx},'J')">MoveJ</button>
                    <button onclick="movePos(${idx},'L')">MoveL</button>
                    <button class="del-btn" onclick="deletePos(${idx})">✕</button>
                `;
                list.appendChild(div);
            }
        }

        async function savePos() {
            const angles = [];
            const container = document.getElementById('joints-container');
            const rows = container.querySelectorAll('.joint-row');
            rows.forEach((row, i) => {
                const el = document.getElementById('angle-' + i);
                angles.push(parseFloat(el.textContent));
            });
            await fetch('/api/points', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({angles})
            });
            fetchSaved();
        }

        async function movePos(idx, mode) {
            await fetch('/api/points/load', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({index: idx, mode})
            });
            const r = await fetch('/api/points');
            const data = await r.json();
            const pos = data.points[idx];
            if (pos) {
                for (let i = 0; i < pos.length; i++) {
                    document.getElementById('angle-' + i).textContent = pos[i].toFixed(1);
                }
            }
        }

        async function deletePos(idx) {
            await fetch('/api/points/delete', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({index: idx})
            });
            fetchSaved();
        }

        async function sendCal() {
            const id = parseInt(document.getElementById('cal-id').value, 16);
            const pos = parseFloat(document.getElementById('cal-pos').value);
            const ratio = parseFloat(document.getElementById('cal-ratio').value);
            const min = parseFloat(document.getElementById('cal-min').value);
            const max = parseFloat(document.getElementById('cal-max').value);
            const status = document.getElementById('cal-status');
            if (isNaN(id) || id < 0 || id > 0x7FF) {
                status.textContent = 'ID inválido (0-7FF)';
                return;
            }
            if (isNaN(pos) || isNaN(ratio) || isNaN(min) || isNaN(max)) {
                status.textContent = 'Campos inválidos';
                return;
            }
            status.textContent = 'Enviando...';
            try {
                const r = await fetch('/api/send_cal', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id, pos, ratio, min, max})
                });
                const result = await r.json();
                status.textContent = result.ok ? 'Enviado' : 'Error: ' + (result.error || 'desconocido');
            } catch (e) {
                status.textContent = 'Error de red';
            }
        }

        async function sendCanMsg() {
            const id = parseInt(document.getElementById('tx-id').value, 16);
            const pos = parseFloat(document.getElementById('tx-pos').value);
            const vel = parseFloat(document.getElementById('tx-vel').value);
            const status = document.getElementById('tx-status');
            if (isNaN(id) || id < 0 || id > 0x7FF) {
                status.textContent = 'ID inválido (0-7FF)';
                return;
            }
            status.textContent = 'Enviando...';
            try {
                const r = await fetch('/api/send', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id, pos, vel})
                });
                const result = await r.json();
                status.textContent = result.ok ? 'Enviado' : 'Error: ' + (result.error || 'desconocido');
            } catch (e) {
                status.textContent = 'Error de red';
            }
        }

        async function fetchFK() {
            try {
                const r = await fetch('/api/fk');
                const data = await r.json();
                document.getElementById('fk-x').textContent = data.x.toFixed(2);
                document.getElementById('fk-y').textContent = data.y.toFixed(2);
                document.getElementById('fk-z').textContent = data.z.toFixed(2);
            } catch (e) {}
        }

        async function validateConfig() {
            const fileInput = document.getElementById('cfg-file');
            const status = document.getElementById('cfg-status');
            if (!fileInput.files || !fileInput.files[0]) {
                status.className = 'err';
                status.textContent = 'Selecciona un archivo JSON';
                return;
            }
            const file = fileInput.files[0];
            status.className = '';
            status.textContent = 'Enviando...';

            try {
                const r = await fetch('/api/config/validate', {
                    method: 'POST',
                    body: file
                });
                const result = await r.json();
                status.className = result.ok ? 'ok' : 'err';
                status.textContent = result.ok
                    ? JSON.stringify(result, null, 2)
                    : 'Error: ' + result.error;
            } catch (e) {
                status.className = 'err';
                status.textContent = 'Error de red o respuesta no valida';
            }
        }

        async function applyConfig() {
            const status = document.getElementById('cfg-status');
            status.className = '';
            status.textContent = 'Aplicando...';
            try {
                const r = await fetch('/api/config/apply', {method: 'POST'});
                const result = await r.json();
                status.className = result.ok ? 'ok' : 'err';
                status.textContent = result.ok
                    ? 'Configuracion aplicada a Cinematics'
                    : 'Error: ' + result.error;
            } catch (e) {
                status.className = 'err';
                status.textContent = 'Error de red';
            }
        }

        async function initControl() {
            const r = await fetch('/api/config');
            const cfg = await r.json();
            const container = document.getElementById('joints-container');
            for (let i = 0; i < cfg.numJoints; i++) {
                const row = document.createElement('div');
                row.className = 'joint-row';
                row.innerHTML = `
                    <span class="joint-label">Joint ${i}</span>
                    <button class="joint-btn" onclick="jointClick(${i}, -5)">−</button>
                    <span class="joint-angle" id="angle-${i}">0.0</span>
                    <button class="joint-btn" onclick="jointClick(${i}, 5)">+</button>
                `;
                container.appendChild(row);
            }
            fetchJoints();
            fetchSaved();
            fetchFK();
            setInterval(fetchJoints, 500);
            setInterval(fetchFK, 500);
        }

        initControl();
        pollMessages();
        updateState();
    </script>
</body>
</html>
